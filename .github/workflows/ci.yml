name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On a PR, a newer push cancels the run in progress. On main it doesn't: cancelling a
# run could stop a deploy halfway, so main's runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Not needed for the build to pass, but without one Better Auth logs errors while Next loads the routes.
      - name: Generate a throwaway auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # Also validates every card: an invalid one fails the build.
      - run: pnpm build
        env:
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and port as docker-compose.yml, so e2e/env.ts works unchanged.
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ztarz
          POSTGRES_PASSWORD: ztarz
          POSTGRES_DB: ztarz
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ztarz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ztarz:ztarz@localhost:5433/ztarz
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate a throwaway auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Build the production image on GitHub's hardware: the 1 GB VPS can't run `next build`.
  image:
    name: Build image
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/sailmanseeulater/ztarz:latest
            ghcr.io/sailmanseeulater/ztarz:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ztarz.latesailor.dev
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (committed), so the job only ever talks to this server.
          echo "$VPS_HOST $(cat deploy/ssh_host_ed25519_key.pub)" > ~/.ssh/known_hosts
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # The run's own token, valid only while this job runs: nothing long-lived lives on the VPS.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd ~/ztarz && git pull --ff-only && deploy/remote-deploy.sh ${{ github.sha }} ${{ github.actor }}"
      - name: Check the public URL
        run: curl -fsS -m 10 https://ztarz.latesailor.dev/api/health
