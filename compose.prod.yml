# Production on the VPS, next to the other apps. The host's nginx terminates TLS and
# proxies ztarz.latesailor.dev to the app on 127.0.0.1:3020. Runbook: docs/deploy.md.
#
# Everything is read from .env in the checkout on the server (never committed), which
# also sets COMPOSE_FILE=compose.prod.yml, so a plain `docker compose up -d` works there.

name: ztarz

services:
  db:
    image: postgres:18-alpine
    container_name: ztarz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ztarz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ztarz}
    # Sized for a shared 1 GB VM: one user, and the app's pool needs far fewer than 100 connections.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 128m
    volumes:
      - pgdata:/var/lib/postgresql
    # Loopback only: for backups and an SSH tunnel (creating the owner). Docker-published
    # ports skip the host firewall, so never publish this on 0.0.0.0.
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ztarz}"]
      interval: 5s
      retries: 10

  app:
    # On the VPS the image is pulled from GHCR, built by CI; locally `docker compose build`
    # builds it under the same name. ZTARZ_TAG pins a commit: rolling back is setting it
    # to an older SHA in .env and running `docker compose up -d`.
    image: ghcr.io/sailmanseeulater/ztarz:${ZTARZ_TAG:-latest}
    build: { context: ., target: runner }
    container_name: ztarz-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ztarz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ztarz}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    # Loopback only; nginx on the host is the way in.
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      db: { condition: service_healthy }

  # Applies pending migrations with the same image the app runs. The deploy runs it before
  # starting a new version: `docker compose run --rm migrate`.
  migrate:
    image: ghcr.io/sailmanseeulater/ztarz:${ZTARZ_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ztarz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ztarz}
    command: ["node", "migrator/migrate.mjs"]
    depends_on:
      db: { condition: service_healthy }
    profiles: [tools]

volumes:
  pgdata:
