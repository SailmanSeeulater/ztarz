# Goes to /etc/nginx/sites-available/ztarz.latesailor.dev on the VPS (symlinked into
# sites-enabled), then `sudo certbot --nginx -d ztarz.latesailor.dev` adds the 443 block
# and the 80 -> 443 redirect to this file.

server {
    server_name ztarz.latesailor.dev;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server Components stream; don't buffer the response.
        proxy_buffering off;
    }

    listen 80;
    listen [::]:80;
}
