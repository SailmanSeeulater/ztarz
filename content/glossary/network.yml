terms:
  - term: IP address
    aka: Internet Protocol address
    short: The number that identifies a device on a network so packets can find it, such as `192.0.2.10` (IPv4) or `2001:db8::1` (IPv6).
    detail: |
      Public addresses are reachable on the internet; private ones (`10.x`, `192.168.x`) only inside a local network, usually behind NAT.
    source: https://developer.mozilla.org/en-US/docs/Glossary/IP_Address
    stack: []
    see: [IPv4, IPv6, DNS, NAT]

  - term: IPv4
    aka: Internet Protocol version 4
    short: The original internet addressing scheme. Addresses are 32 bits, written as four numbers from 0 to 255, like `203.0.113.7`.
    fun: 32 bits allow only 4,294,967,296 addresses, which turned out too few. The shortage is called IPv4 address exhaustion and is why NAT and IPv6 exist.
    source: https://en.wikipedia.org/wiki/IPv4
    stack: []
    see: [IP address, IPv6, NAT, CIDR]

  - term: IPv6
    aka: Internet Protocol version 6
    short: The successor to IPv4 with 128-bit addresses, written in hex groups like `2001:db8::1`. The `::` stands for a run of zero groups.
    detail: |
      There are enough addresses for every device to have a public one, so NAT is not needed. Most networks run IPv4 and IPv6 side by side.
    fun: There is no IPv5 in use. Version 5 went to the experimental Internet Stream Protocol, so the next IP was numbered 6.
    source: https://en.wikipedia.org/wiki/IPv6
    stack: []
    see: [IPv4, IP address]

  - term: Port
    aka: Port number
    short: A number from 0 to 65535 that picks which program on a machine gets the traffic. The IP address finds the computer; the port finds the service.
    detail: |
      Ports below 1024 are the well-known ones, such as 22 (SSH), 53 (DNS), 80 (HTTP) and 443 (HTTPS). "Address already in use" means another process is listening on that port.
    source: https://en.wikipedia.org/wiki/Port_(computer_networking)
    stack: []
    see: [IP address, TCP, UDP]

  - term: TCP
    aka: Transmission Control Protocol
    short: The transport protocol that gives you a reliable, ordered byte stream. Lost packets are resent and data arrives in the order it was sent.
    detail: |
      A connection starts with a three-way handshake (SYN, SYN-ACK, ACK), which costs a round trip before any data moves. HTTP/1.1, HTTP/2, SSH and database connections run on TCP.
    source: https://developer.mozilla.org/en-US/docs/Glossary/TCP
    stack: []
    see: [UDP, Port, Packet]

  - term: UDP
    aka: User Datagram Protocol
    short: A transport protocol that sends independent packets with no handshake, no retries and no ordering. It is fast and simple; the application handles any losses.
    detail: |
      Used where late data is useless or the app wants control: DNS lookups, video calls, games, and QUIC, which carries HTTP/3.
    source: https://developer.mozilla.org/en-US/docs/Glossary/UDP
    stack: []
    see: [TCP, Port, DNS]

  - term: DNS
    aka: Domain Name System
    short: The internet's phone book. It turns a name like `example.com` into the IP address your computer connects to.
    detail: |
      Your resolver asks a root server, then the `.com` servers, then the domain's own name servers, caching each answer for its TTL. Common records are `A` (IPv4), `AAAA` (IPv6), `CNAME` (alias), `MX` (mail) and `TXT`.
    fun: At the top sit just thirteen groups of root name servers, each copied to many places worldwide using anycast.
    source: https://en.wikipedia.org/wiki/Domain_Name_System
    stack: []
    see: [Domain name, IP address, TTL]

  - term: TTL
    aka: Time to live
    short: A limit on how long data may live. In DNS it is how many seconds a cached answer stays valid; in an IP packet it caps how many routers the packet may pass through.
    detail: |
      Lower a DNS record's TTL a day before you move a server, so caches pick up the new address quickly.
    fun: The IP field is named for time, but in practice each router just subtracts one, so IPv6 renamed it "hop limit".
    source: https://en.wikipedia.org/wiki/Time_to_live
    stack: []
    see: [DNS, Packet, Router]

  - term: Packet
    short: A small chunk of data sent across a network, with a header saying where it comes from and where it is going. Big messages are split into many packets and reassembled.
    source: https://developer.mozilla.org/en-US/docs/Glossary/Packet
    stack: []
    see: [Router, TCP, UDP]

  - term: Router
    short: A device that forwards packets between networks, choosing the next hop towards each destination. Your home router joins your local network to your provider's.
    source: https://developer.mozilla.org/en-US/docs/Glossary/Router
    stack: []
    see: [Packet, NAT, IP address]

  - term: NAT
    aka: Network Address Translation
    short: A router trick that lets many devices share one public IP address by rewriting addresses and ports as packets pass through.
    detail: |
      Outbound connections just work; inbound ones need port forwarding, because the router does not know which inside device should get them.
    source: https://en.wikipedia.org/wiki/Network_address_translation
    stack: []
    see: [IPv4, Router, IP address]

  - term: CIDR
    aka: Classless Inter-Domain Routing
    short: The `address/prefix` notation for a block of IP addresses. `10.0.0.0/24` means the first 24 bits are fixed, giving 256 addresses from `10.0.0.0` to `10.0.0.255`.
    detail: |
      A smaller prefix is a bigger block: `/16` is 65,536 addresses, `/32` is exactly one. You meet it in cloud VPCs, security groups and firewall rules.
    fun: The IETF introduced CIDR in 1993 to replace fixed address classes and slow both IPv4 exhaustion and routing-table growth.
    source: https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing
    stack: []
    see: [IPv4, Subnet, IP address]

  - term: Subnet
    aka: Subnetwork
    short: A slice of a network's address range, written in CIDR notation. Machines in the same subnet talk directly; traffic to other subnets goes through a router.
    source: https://en.wikipedia.org/wiki/Subnet
    stack: []
    see: [CIDR, Router]

  - term: Localhost
    aka: Loopback
    short: The name for your own machine. Traffic to `localhost` or `127.0.0.1` never leaves the computer, which is why dev servers listen there.
    detail: |
      A server bound to `127.0.0.1` is unreachable from other machines and from inside other containers; bind to `0.0.0.0` to accept outside connections. IPv6 loopback is `::1`.
    fun: IPv4 reserves the whole `127.0.0.0/8` block for loopback, over 16 million addresses, though almost everyone uses only `127.0.0.1`.
    source: https://en.wikipedia.org/wiki/Localhost
    stack: []
    see: [IP address, CIDR]

  - term: Latency
    short: The delay before data arrives, usually measured as a round trip in milliseconds. Distance, hops and handshakes all add to it.
    detail: |
      Latency is not bandwidth: a fat pipe to a far-away server is still slow to start. Fewer round trips (caching, CDNs, connection reuse) is often the bigger win.
    source: https://developer.mozilla.org/en-US/docs/Glossary/Latency
    stack: []
    see: [Bandwidth, CDN]

  - term: Bandwidth
    short: How much data a connection can carry per second, such as 100 Mbit/s. It sets how fast large transfers finish, not how quickly the first byte arrives.
    source: https://developer.mozilla.org/en-US/docs/Glossary/Bandwidth
    stack: []
    see: [Latency]

  - term: TLS
    aka: Transport Layer Security
    short: The protocol that encrypts a connection and proves the server's identity with a certificate. It is the S in HTTPS.
    detail: |
      During the handshake the client checks the certificate chain against trusted authorities and both sides agree session keys. TLS 1.2 and 1.3 are the versions in use; anything older should be off.
    fun: TLS grew out of Netscape's SSL, and SSL 1.0 was never publicly released. People still say "SSL certificate".
    source: https://en.wikipedia.org/wiki/Transport_Layer_Security
    stack: []
    see: [HTTPS, Public-key cryptography]

  - term: OSI model
    aka: Open Systems Interconnection model
    short: A seven-layer way of describing networks, from physical cables (1) up to applications (7). Engineers use the numbers as shorthand, as in "a layer 7 load balancer".
    detail: |
      The layers are physical, data link, network (IP), transport (TCP, UDP), session, presentation and application (HTTP). The real internet follows the simpler TCP/IP model, but the vocabulary stuck.
    fun: The model was published by ISO in 1984 as standard ISO 7498.
    source: https://en.wikipedia.org/wiki/OSI_model
    stack: []
    see: [TCP, IP address, Load balancer]

  - term: Firewall
    short: A filter that allows or blocks network traffic by rules, such as "allow 443 from anywhere, allow 22 only from the office".
    detail: |
      Default-deny is the safe start: block everything inbound, then open only what you need. Cloud security groups are firewalls.
    fun: The name comes from buildings, where a firewall is a wall that stops a fire spreading to the next property.
    source: https://en.wikipedia.org/wiki/Firewall_(computing)
    stack: []
    see: [Port, Principle of least privilege]

  - term: Load balancer
    short: A server that spreads incoming requests across several backend servers, so no single one is overloaded and a dead one can be taken out of rotation.
    detail: |
      Common strategies are round robin and least connections. Health checks remove failing backends. A layer 4 balancer routes by IP and port; a layer 7 one can route by URL or header.
    source: https://en.wikipedia.org/wiki/Load_balancing_(computing)
    stack: []
    see: [Reverse proxy, OSI model]

  - term: Proxy server
    short: A server that sits between a client and the internet and makes requests on the client's behalf, often to filter, cache or hide where traffic comes from.
    source: https://developer.mozilla.org/en-US/docs/Glossary/Proxy_server
    stack: []
    see: [Reverse proxy]

  - term: Reverse proxy
    short: A server in front of your app that receives client requests and passes them on to the app. Clients only ever see the proxy.
    detail: |
      Typical jobs are TLS termination, compression, caching, rate limiting and routing paths to different services. nginx is the classic example. Your app sees the proxy's IP unless it reads `X-Forwarded-For`.
    source: https://en.wikipedia.org/wiki/Reverse_proxy
    stack: [nginx]
    see: [Proxy server, Load balancer, TLS]
